[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yui-assistant"
version = "0.1.0"
description = "YUI: Asistente autónomo de sistema operativo de nueva generación, contextual, multimodal y guiado por agentes."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Julsanchezc" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "psutil>=5.9.8",
    "sounddevice>=0.4.7",
    "numpy>=1.26.4",
    "edge-tts>=6.1.12",
    "faster-whisper>=1.0.2",
    "google-genai>=0.1.1",
    "lancedb>=0.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.0",
    "mypy>=1.9.0"
]
windows-full = [
    "pywin32>=306",
    "pywinauto>=0.6.8"
]

[project.scripts]
yui = "yui.main:app"

[tool.hatch.build.targets.wheel]
packages = ["yui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
