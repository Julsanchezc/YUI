<!DOCTYPE html>
<html lang="es" class="h-full bg-transparent">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUI — Notch Companion Agent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes wave-pulse {
      0%, 100% { height: 6px; }
      50% { height: 22px; }
    }
    .wave-active {
      animation: wave-pulse 1.1s infinite ease-in-out;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.6);
    }
    /* Transparent Canvas for Notch */
    html, body {
      background: transparent !important;
      background-color: transparent !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      width: 100%;
      height: 100%;
    }
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    /* Acrylic Notch Container styling */
    .yui-notch-acrylic {
      background: rgba(2, 6, 23, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 0 0 22px 22px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8), 0 0 15px rgba(56, 189, 248, 0.1);
      overflow: hidden;
    }
  </style>
</head>
<body class="h-full bg-transparent text-slate-100 overflow-hidden font-sans antialiased selection:bg-cyan-500 selection:text-black">
  <!-- Notch & Dynamic Island Mount Point -->
  <div id="app"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
