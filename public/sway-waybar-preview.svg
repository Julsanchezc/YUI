<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080c" />
      <stop offset="50%" stop-color="#0f1119" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <!-- Island Glow -->
    <radialGradient id="cyanGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0" />
    </radialGradient>

    <!-- Companion Gradient -->
    <linearGradient id="yuiBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glass filter -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Screen Background -->
  <rect width="1000" height="480" rx="16" fill="url(#bgGrad)" stroke="#232839" stroke-width="2"/>

  <!-- Sway Wallpaper Ambient Grid -->
  <g opacity="0.08" stroke="#00d4ff" stroke-width="1">
    <path d="M0,80 L1000,80 M0,160 L1000,160 M0,240 L1000,240 M0,320 L1000,320 M0,400 L1000,400" />
    <path d="M100,0 L100,480 M250,0 L250,480 M400,0 L400,480 M550,0 L550,480 M700,0 L700,480 M850,0 L850,480" />
  </g>

  <!-- Waybar (Top Bar) -->
  <rect x="0" y="0" width="1000" height="38" fill="#07080c" opacity="0.88" />
  <line x1="0" y1="38" x2="1000" y2="38" stroke="#232839" stroke-width="1" />

  <!-- Waybar Left: Active Window / Distro Pill -->
  <g transform="translate(16, 8)">
    <rect width="118" height="22" rx="11" fill="#181c28" stroke="#232839" stroke-width="1"/>
    <text x="14" y="15" fill="#00d4ff" font-family="monospace" font-size="11" font-weight="bold"> Kala Linux</text>
  </g>

  <!-- Waybar Left: YUI Status Module Pill -->
  <g transform="translate(142, 8)">
    <rect width="90" height="22" rx="11" fill="rgba(0, 212, 255, 0.12)" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="16" cy="11" r="3.5" fill="#00e676"/>
    <text x="26" y="15" fill="#00d4ff" font-family="monospace" font-size="11" font-weight="bold">󰚩 YUI Live</text>
  </g>

  <!-- Waybar Center: Workspaces & Clock -->
  <g transform="translate(420, 8)">
    <rect width="160" height="22" rx="11" fill="#0f1119" stroke="#232839" stroke-width="1"/>
    <circle cx="28" cy="11" r="4" fill="#00d4ff"/>
    <circle cx="50" cy="11" r="3" fill="#8b92b0" opacity="0.4"/>
    <circle cx="72" cy="11" r="3" fill="#8b92b0" opacity="0.4"/>
    <text x="96" y="15" fill="#eef0f6" font-family="monospace" font-size="11" font-weight="bold">10:48 AM</text>
  </g>

  <!-- Waybar Right: Hardware Stats (CPU, Mem, Audio, Bat) -->
  <g transform="translate(760, 8)">
    <rect width="224" height="22" rx="11" fill="#181c28" stroke="#232839" stroke-width="1"/>
    <text x="12" y="15" fill="#8b92b0" font-family="monospace" font-size="10">󰻠 14%  󰍛 3.2G   75%  󰁹 98%</text>
  </g>

  <!-- Ambient Glow from Notch -->
  <circle cx="500" cy="38" r="220" fill="url(#cyanGlow)" pointer-events="none" />

  <!-- YUI Dynamic Island Floating Notch (Center Top) -->
  <g transform="translate(240, 38)" filter="url(#shadowFilter)">
    
    <!-- Island Backdrop Panel -->
    <path d="M 0,0 L 520,0 L 520,290 C 520,314 498,330 475,330 L 45,330 C 22,330 0,314 0,290 Z" 
          fill="#07080c" fill-opacity="0.94" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Notch Header -->
    <g transform="translate(18, 14)">
      <!-- YUI Character Avatar (Squircle) -->
      <rect x="0" y="0" width="52" height="52" rx="16" fill="url(#yuiBody)" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Eyes projected on sphere -->
      <rect x="14" y="18" width="6" height="12" rx="3" fill="#0f172a"/>
      <rect x="32" y="18" width="6" height="12" rx="3" fill="#0f172a"/>
      <!-- Catchlights -->
      <circle cx="16" cy="20" r="1.5" fill="#ffffff"/>
      <circle cx="34" cy="20" r="1.5" fill="#ffffff"/>
      <!-- Happy Blush -->
      <circle cx="10" cy="34" r="3.5" fill="#ec4899" opacity="0.6"/>
      <circle cx="42" cy="34" r="3.5" fill="#ec4899" opacity="0.6"/>

      <!-- Header Labels -->
      <text x="66" y="22" fill="#eef0f6" font-family="sans-serif" font-size="15" font-weight="bold">YUI</text>
      <rect x="100" y="11" width="70" height="15" rx="7.5" fill="rgba(0, 212, 255, 0.15)" stroke="#00d4ff" stroke-width="0.8"/>
      <text x="106" y="22" fill="#00d4ff" font-family="monospace" font-size="8" font-weight="bold">SEMI-AGENTIC</text>

      <text x="66" y="38" fill="#8b92b0" font-family="monospace" font-size="10">ElevenLabs TTS • Gemini 2.0 • OpenCode</text>

      <!-- Wave Bars (Right) -->
      <g transform="translate(380, 16)">
        <rect x="0" y="6" width="3" height="14" rx="1.5" fill="#00d4ff"/>
        <rect x="6" y="2" width="3" height="22" rx="1.5" fill="#00d4ff"/>
        <rect x="12" y="8" width="3" height="10" rx="1.5" fill="#00d4ff"/>
        <rect x="18" y="0" width="3" height="26" rx="1.5" fill="#00d4ff"/>
        <rect x="24" y="4" width="3" height="18" rx="1.5" fill="#00d4ff"/>
      </g>

      <!-- Key Badge -->
      <g transform="translate(426, 15)">
        <rect width="52" height="20" rx="10" fill="#181c28" stroke="#232839" stroke-width="1"/>
        <text x="8" y="14" fill="#00e676" font-family="monospace" font-size="9" font-weight="bold">JA1 (7)</text>
      </g>
    </g>

    <!-- Thinking Box -->
    <g transform="translate(20, 84)">
      <rect width="480" height="52" rx="10" fill="#181c28" fill-opacity="0.8" stroke="#b388ff" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="19" fill="#b388ff" font-family="monospace" font-size="9" font-weight="bold">⚙ PENSAMIENTO AGÉNTICO (GEMINI REASONING)</text>
      <text x="14" y="37" fill="#eef0f6" font-family="sans-serif" font-size="11">Detectada orden de codificación ➔ Conectando con OpenCode Agent...</text>
    </g>

    <!-- OpenCode Agent Activity Pill -->
    <g transform="translate(20, 146)">
      <rect width="480" height="66" rx="10" fill="#0f1119" stroke="#00e676" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="20" cy="22" r="5" fill="#00e676"/>
      <text x="34" y="26" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">OpenCode Bridge • Sesión Activa</text>
      <text x="34" y="46" fill="#8b92b0" font-family="monospace" font-size="10">Tarea: Refactorizar módulo audio con visemas FFT para Sway</text>
    </g>

    <!-- Voice / Input Bar -->
    <g transform="translate(20, 222)">
      <rect width="480" height="42" rx="12" fill="#0f1119" stroke="#232839" stroke-width="1"/>
      <text x="18" y="26" fill="#8b92b0" font-family="sans-serif" font-size="12">🎙️ "OpenCode, compila el ejecutable para Arch Linux..."</text>
      
      <!-- Mic Button -->
      <g transform="translate(436, 6)">
        <circle cx="15" cy="15" r="15" fill="#00d4ff"/>
        <path d="M 12,9 C 12,7.5 13.5,6.5 15,6.5 C 16.5,6.5 18,7.5 18,9 L 18,15 C 18,16.5 16.5,17.5 15,17.5 C 13.5,17.5 12,16.5 12,15 Z" fill="#07080c"/>
        <path d="M 9,13 C 9,16.5 12,19.5 15,19.5 C 18,19.5 21,16.5 21,13" stroke="#07080c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <line x1="15" y1="20" x2="15" y2="23" stroke="#07080c" stroke-width="1.8"/>
      </g>
    </g>

    <!-- Quick Actions Bottom -->
    <g transform="translate(24, 280)">
      <text x="0" y="16" fill="#8b92b0" font-family="monospace" font-size="10">Atajo Sway: <tspan fill="#00d4ff">Super + Shift + Y</tspan> | Super + ` | Voz ElevenLabs Activa</text>
    </g>

  </g>

</svg>
